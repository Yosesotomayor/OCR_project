services:
  app:
    build: .
    volumes:
      - .:/app
      - ./storage:/app/storage # Aquí vivirán los PDFs e imágenes
    working_dir: /app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgresdb:
        condition: service_healthy
      chromadb:
        condition: service_started

  chromadb:
    image: chromadb/chromadb:latest
    restart: always
    volumes:
      - chroma_data:/chroma/data
    ports:
      - "8008:8000"

  postgresdb:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  chroma_data: