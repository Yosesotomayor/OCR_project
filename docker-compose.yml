services:
  app:
    build: .
    command: sleep infinity
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://yose:mifel_password@db:5432/ocr_db
      - PYSPARK_PYTHON=python3
    ports:
      - "4040:4040"
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=yose
      - POSTGRES_PASSWORD=mifel_password
      - POSTGRES_DB=ocr_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: