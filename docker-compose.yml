services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ocr-project-frontend
    ports:
      - "80:80"
    networks:
      - frontend-net
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      network: host
    image: ocr-project-backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresdb:5432/${POSTGRES_DB}
      - ML_SERVICE_URL=http://ml-service:8001
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=artifacts
    volumes:
      - ./storage:/app/storage 
    networks:
      - frontend-net
      - backend-net
    depends_on:
      postgresdb:
        condition: service_healthy
      chromadb:
        condition: service_started

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
      network: host
    image: ocr-project-ml-service
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresdb:5432/${POSTGRES_DB}
    volumes:
      - ./storage:/app/storage
    networks:
      - backend-net
    depends_on:
      - chromadb
      - postgresdb
      

  chromadb:
    image: chromadb/chroma:latest
    restart: always
    volumes:
      - chroma_data:/chroma/data
    ports:
      - "8008:8000"
    networks:
      - backend-net

  postgresdb:
    image: postgres:17-bookworm
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    networks:
      - backend-net
    depends_on:
      - postgresdb

  minio:
    image: minio/minio
    restart: always
    ports:
      - "9000:9000" # API
      - "9001:9001" # Consola UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - backend-net
    command: server /data --console-address ":9001"

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    networks:
      - backend-net
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}) do echo '...waiting for minio...' && sleep 1; done;
      /usr/bin/mc mb local/artifacts;
      /usr/bin/mc policy set public local/artifacts;
      exit 0;
      "

networks:
  frontend-net:
  backend-net:

volumes:
  postgres_data:
  chroma_data:
  minio_data: