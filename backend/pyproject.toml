[project]
name = "backend"
version = "0.1.0"
description = "OCR Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.27",
    "python-multipart>=0.0.9",
    "shared-schemas",
]

[tool.uv.sources]
shared-schemas = { path = "../shared", editable = true }
