[project]
name = "ml-service"
version = "0.1.0"
description = "A project for OCR processing"
requires-python = ">=3.11"
dependencies = [
    "easyocr>=1.7.2",
    "fastapi>=0.133.0",
    "ipykernel>=7.2.0",
    "numpy>=2.4.2",
    "shared-schemas>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["./"]

[tool.uv.workspace]
members = [
    "ml-service",
]

[tool.uv.sources]
shared-schemas = { path = "../shared" }
